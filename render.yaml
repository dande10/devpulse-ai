databases:
  - name: devpulse-db
    plan: free
    databaseName: devpulse
    user: devpulse

services:
  - type: web
    name: devpulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devpulse-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://devpulse-frontend.onrender.com
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_MAX_RESULTS
        value: "10"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: devpulse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://devpulse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
